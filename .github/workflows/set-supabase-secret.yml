name: Set Supabase Secret Manually

on:
  workflow_dispatch:
    inputs:
      secret_name:
        description: 'The name of the secret to set (e.g., APP_URL)'
        required: true
        type: string
      secret_value:
        description: 'The value of the secret'
        required: true
        type: string

jobs:
  set-secret:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Set Supabase Secret
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SECRET_NAME_INPUT: ${{ inputs.secret_name }}
          SECRET_VALUE_INPUT: ${{ inputs.secret_value }}
        run: |
          echo "Setting secret: $SECRET_NAME_INPUT"
          # Create a temporary .env file
          echo "$SECRET_NAME_INPUT=$SECRET_VALUE_INPUT" > .env.tmp
          # Run the command with the temporary file
          supabase secrets set --env-file .env.tmp
          # Clean up the temp file
          rm .env.tmp
