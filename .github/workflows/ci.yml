name: CI - Tests and Lint

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch: # Allows manual triggering

jobs:
  test:
    name: Frontend (Node.js) Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install dependencies
        run: npm ci
      - name: Run lint
        run: npm run lint
      - name: Run tests
        run: npm run test
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}

  deno-test:
    name: Backend (Deno) Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: denoland/setup-deno@v1
        with:
          deno-version: v1.x

      - name: Setup Supabase CLI
        uses: supabase/cli-action@v1.4.1

      - name: Verify Supabase Secrets for PayPal Integration
        run: |
          echo "Verifying required Supabase secrets for PayPal integration..."
          # Ensure SUPABASE_ACCESS_TOKEN and SUPABASE_URL are available as GitHub secrets
          if [ -z "${{ secrets.SUPABASE_ACCESS_TOKEN }}" ]; then
            echo "Error: SUPABASE_ACCESS_TOKEN secret is missing. Cannot verify Supabase secrets."
            exit 1
          fi
          if [ -z "${{ secrets.SUPABASE_URL }}" ]; then
            echo "Error: SUPABASE_URL secret is missing. Cannot connect to Supabase project."
            exit 1
          fi

          # Extract Supabase project ID from SUPABASE_URL
          PROJECT_ID=$(echo "${{ secrets.SUPABASE_URL }}" | grep -oP 'https://\K[^.]+')
          if [ -z "$PROJECT_ID" ]; then
            echo "Error: Could not extract Supabase project ID from SUPABASE_URL."
            exit 1
          fi

          # Set Supabase CLI environment variables
          export SUPABASE_ACCESS_TOKEN="${{ secrets.SUPABASE_ACCESS_TOKEN }}"
          export SUPABASE_PROJECT_REF="$PROJECT_ID"

          echo "Checking for required PayPal secrets in Supabase project: $PROJECT_ID"
          
          # Check for required PayPal secrets
          REQUIRED_SECRETS=("PAYPAL_CLIENT_ID" "PAYPAL_CLIENT_SECRET" "PAYPAL_PLAN_ID" "PAYPAL_WEBHOOK_ID" "PAYPAL_API_URL")
          MISSING_SECRETS=""

          for secret in "${REQUIRED_SECRETS[@]}"; do
            # Use 'supabase secrets list' to get secrets and grep to check for each one.
            # The output of 'supabase secrets list' is typically one secret name per line.
            if ! supabase secrets list --project-ref "$PROJECT_ID" | grep -q "^$secret$"; then
              MISSING_SECRETS+="$secret "
            fi
          done

          if [ -n "$MISSING_SECRETS" ]; then
            echo "❌ Error: Missing required Supabase secrets for PayPal integration: $MISSING_SECRETS"
            exit 1
          else
            echo "✅ All required PayPal secrets are present in Supabase project '$PROJECT_ID'."
          fi
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }} # Supabase CLI needs this to know which project to connect to

      - name: Run Deno tests
        run: deno test --allow-net --allow-env --allow-read supabase/functions/
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
